<!doctype html>
<html lang="es">
  <body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px">
      <tr>
        <td style="padding:32px">
          <h1 style="margin:0 0 16px;font-size:22px">Restablece tu contraseña</h1>
          <p style="margin:0 0 16px;font-size:15px;line-height:1.5">
            Recibimos una solicitud para restablecer la contraseña de tu cuenta ({{ .Email }}).
          </p>
          <p style="margin:0 0 24px">
            <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=recovery"
               style="display:inline-block;background:#e11d48;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:8px">
              Crear nueva contraseña
            </a>
          </p>
          <p style="margin:0 0 8px;font-size:13px;color:#52525b;line-height:1.5">
            El enlace vence en 1 hora y solo se puede usar una vez.
          </p>
          <p style="margin:0;font-size:13px;color:#52525b;line-height:1.5">
            Si no pediste este cambio, ignora este correo: tu contraseña actual sigue funcionando.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
